<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task no 8</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

</head>

<body>
  <div class="main-wrapper d-flex align-items-center justify-content-center vh-100 bg-light p-2">

    <div class="bg-white shadow-sm d-flex justify-content-center align-items-center"
      style="width: 100%; max-width: 500px; min-height: 85vh; padding: 30px 20px;">

      <div class="card border-0 text-white p-4 shadow-lg"
        style="width: 100%; max-width: 380px; background-color: #008ecc; border-radius: 45px !important;">

        <div class="card-body p-1">
          <div class="mb-4">
            <span class="badge rounded-pill bg-white bg-opacity-25 px-3 py-2 text-uppercase" style="font-size: 0.7rem;">
              <i class="bi bi-chat-dots-fill me-2"></i> Get in Touch
            </span>
          </div>

          <h2 class="fw-bold mb-3" style="font-size: 1.7rem; line-height: 1.2;">Let's Bring Your Vision to Life</h2>

            Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni
            dolores.
          </p>

          <div class="d-flex flex-column gap-3 mb-4">
            <div class="d-flex align-items-center bg-white bg-opacity-10 p-3 rounded-4">
              <div class="bg-white rounded-3 p-2 me-3 d-flex align-items-center justify-content-center"

                <i class="bi bi-envelope-fill" style="color: #008ecc;"></i>
              </div>
              <div>
                <small class="d-block text-uppercase fw-bold opacity-75" style="font-size: 0.65rem;">Email Us</small>
                <span class="fw-semibold" style="font-size: 0.85rem;">support@example.com</span>
              </div>
            </div>

            <div class="d-flex align-items-center bg-white bg-opacity-10 p-3 rounded-4">
              <div class="bg-white rounded-3 p-2 me-3 d-flex align-items-center justify-content-center"
                style="width: 40px; height: 40px;">
                <i class="bi bi-telephone-fill" style="color: #008ecc;"></i>
              </div>
              <div>
                <small class="d-block text-uppercase fw-bold opacity-75" style="font-size: 0.65rem;">Call Us</small>
                <span class="fw-semibold" style="font-size: 0.85rem;">+1 (555) 890-1234</span>
              </div>
            </div>
          </div>

          <div class="row text-center bg-white bg-opacity-10 rounded-4 py-3 g-0 mb-4">
            <div class="col-4 border-end border-white border-opacity-25">
              <h5 class="fw-bold mb-0">98%</h5>
              <small class="opacity-75" style="font-size: 0.5rem;">SATISFACTION</small>
            </div>
            <div class="col-4 border-end border-white border-opacity-25">
              <h5 class="fw-bold mb-0">24/7</h5>
              <small class="opacity-75" style="font-size: 0.5rem;">SUPPORT</small>
            </div>
            <div class="col-4">
              <h5 class="fw-bold mb-0">3.2k</h5>
              <small class="opacity-75" style="font-size: 0.5rem;">PROJECTS</small>
            </div>
          </div>

          <div class="d-flex align-items-center gap-2">
            <span class="fw-bold me-2" style="font-size: 0.85rem;">Follow Us</span>
            <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center"
              style="width: 32px; height: 32px;"><i class="bi bi-facebook fs-6"></i></div>
            <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center"
              style="width: 32px; height: 32px;"><i class="bi bi-twitter-x fs-6"></i></div>
            <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center"
              style="width: 32px; height: 32px;"><i class="bi bi-linkedin fs-6"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
